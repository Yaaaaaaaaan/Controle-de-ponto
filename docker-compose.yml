# docker-compose.yml (Versão Corrigida)

services:
  web:
    build: .  # 1. Diz ao Compose para construir a imagem usando o Dockerfile na pasta atual
    ports:
      - "8080:80"
    volumes:
      # 2. Monta o diretório inteiro do projeto, não apenas a pasta Public
      - ./:/var/www/html:z
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      # 3. As credenciais AGORA CORRESPONDEM ao seu db.php, exceto a senha
      MYSQL_ROOT_PASSWORD: '' # Senha do root vazia (não recomendado para produção)
      MYSQL_DATABASE: controle_ponto_db # Nome do banco de dados correto
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes" # Permite que o root tenha senha vazia
    volumes:
      # 4. Monta o seu script SQL para inicializar o banco de dados na primeira vez
      - ./App/Config/db.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

volumes:
  db_data: